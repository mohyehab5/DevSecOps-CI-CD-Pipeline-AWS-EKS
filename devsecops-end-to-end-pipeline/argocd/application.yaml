apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_GH_ORG/devsecops-end-to-end-pipeline.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-app

  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true    # revert any manual `kubectl edit` drift back to what's in git
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
