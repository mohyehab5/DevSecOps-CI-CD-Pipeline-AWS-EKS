apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops-app-alerts
  namespace: devsecops-app
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: devsecops-app.rules
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(app_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(app_requests_total[5m])) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Error rate above 5% for 5 minutes"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="devsecops-app"}[15m]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"

        - alert: HighP99Latency
          expr: histogram_quantile(0.99, rate(app_request_latency_seconds_bucket[5m])) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "P99 latency above 1s for 10 minutes"
