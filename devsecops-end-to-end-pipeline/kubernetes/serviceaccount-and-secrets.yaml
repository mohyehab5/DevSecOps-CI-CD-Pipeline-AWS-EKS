apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-app-sa
  namespace: devsecops-app
  annotations:
    # IRSA: this ServiceAccount assumes a scoped IAM role directly — the pod
    # never touches the underlying EC2 node's IAM role.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/devsecops-app-irsa-role
---
# External Secrets Operator syncs from AWS Secrets Manager into a native K8s Secret.
# The secret VALUE never lives in git — only this reference does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: devsecops-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: prod/db/credentials
        property: password
