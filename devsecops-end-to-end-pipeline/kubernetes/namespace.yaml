apiVersion: v1
kind: Namespace
metadata:
  name: devsecops-app
  labels:
    # Built-in Pod Security Admission — rejects any pod that doesn't meet the
    # "restricted" profile (no root, no privilege escalation, no host access) at admission time.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
